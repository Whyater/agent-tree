name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Contrast check
        run: python scripts/check_contrast.py
      - name: CLI smoke test
        run: |
          export AGENT_TREE_HOME="$RUNNER_TEMP/att"
          python -m agent_tree scan
          python -m agent_tree doctor || true
          python -m agent_tree threads
