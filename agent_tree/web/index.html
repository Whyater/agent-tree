<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Agent Tree</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
  <script src="js/theme-init.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="content">
      <main id="main" tabindex="-1" aria-live="off"></main>
      <footer class="statusbar" id="statusbar" aria-label="Status"></footer>
    </div>
  </div>
  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p style="padding:24px">Agent Tree needs JavaScript enabled.</p></noscript>
</body>
</html>
